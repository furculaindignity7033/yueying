[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yueying"
version = "0.1.0"
description = "阅影：把视频变成 AI 能读的文字稿和关键帧，让 Claude Code / Cursor 等编程助手看懂视频"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vsh5dvsch7-png" }]
keywords = ["video", "whisper", "claude-code", "agent-skill", "transcript", "keyframes", "bilibili", "youtube"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper>=1.1",
  "yt-dlp>=2025.1.1",
  "imageio-ffmpeg>=0.5",
  "pillow>=10.1",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[project.urls]
Homepage = "https://github.com/vsh5dvsch7-png/yueying"
Repository = "https://github.com/vsh5dvsch7-png/yueying"
Issues = "https://github.com/vsh5dvsch7-png/yueying/issues"

[project.scripts]
yueying = "yueying.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yueying = ["skill/SKILL.md"]
