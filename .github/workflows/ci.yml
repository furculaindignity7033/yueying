# Fast test suite (no speech recognition, no network) on Linux / Windows / macOS.
# ASR tests are opt-in locally: pytest -m asr
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TQDM_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Server starts
        run: yueying-mcp --check
      - name: Tests (no ASR, no network)
        run: pytest -q -m "not asr and not net"

  # Glama and other registries start the image and introspect it; prove that works.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build -t yueying:ci .
      - name: Install client
        run: pip install "mcp>=2.2,<3"
      - name: Introspect over stdio
        run: python .github/scripts/docker_introspect.py

  # The fast suite skips media; this proves the real pipeline works off Windows too.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TQDM_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install .
      - name: Real run (CLI + MCP, tiny model on CPU)
        run: python .github/scripts/e2e_check.py
