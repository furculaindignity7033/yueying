# 发布到 PyPI：在 GitHub 上发一个 Release 就会自动构建并上传。
# 需要先在 PyPI 项目设置里添加 Trusted Publisher：owner vsh5dvsch7-png，repo yueying，workflow publish.yml，environment pypi
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
